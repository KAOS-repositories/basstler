schema_version: 1
id: agentic-loops
title: 'Agentic loops: finished stages start the sessions that follow them'
description: A finished plan-item stage starts the next stage's session by itself, so work is reviewed
  and resolved without anyone starting each session. The first loop is kickoff, review, resolve and
  review again, capped by rounds and turned on per user; each session also marks every pull request it
  pushed viewed.
default_repository: KAOS-repositories/basstler
tracking_issue: 316
waves:
- id: first-loop
  name: First loop
  description: Kickoff, review and resolve chained, then proven on a real run.
tracks:
- id: loops
  name: Loops
  wave: first-loop
