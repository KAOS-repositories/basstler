- id: reduced-review-diff
  title: Show a reviewer only what is left once rule fixes are reversed
  track: pattern-fixes
  depends_on:
  - rule-fix-triage
  status: not started
  recommended_model: sonnet
  notes: For a file mixing a rule fix and a real change, reverse the fix's actions on the
    head and show the remaining diff against the base in the report.
