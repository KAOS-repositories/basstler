schema_version: 1
id: code-rule-fixes
title: 'Code rule fixes: applied automatically and proven mechanical'
description: Code rules declare reversible fixes that code-rules fix applies, and the review
  triage marks a file mechanical when recomputing a rule's fix, or replaying a recorded modification
  plan, on the base reproduces the head.
default_repository: KAOS-repositories/basstler
waves:
- id: fixes
  name: Fixes
tracks:
- id: pattern-fixes
  name: Rule fixes applied and proven mechanical
  wave: fixes
items:
