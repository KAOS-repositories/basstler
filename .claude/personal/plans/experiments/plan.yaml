schema_version: 1
id: experiments
title: 'Experiments: build an idea end to end, then choose how it lands'
description: 'Build an idea end to end in a sandbox and iterate until it is liked; at every stage the
  user picks the next move: keep iterating, drop it, split it into a plan the same session implements,
  or open it upstream as one pull request. Experiments are listed on the hub with their next moves.

  '
default_repository: KAOS-repositories/basstler
tracking_issue: 192
waves:
- id: experiments
  name: Experiments
  description: Experiment entries, the skill, the hub listing and the two finishing paths
tracks:
- id: record
  name: Record and skill
  wave: experiments
- id: hub
  name: Hub
  wave: experiments
- id: finishing
  name: Finishing
  wave: experiments
items:
- id: experiment-record
  title: An experiment is a recorded entry with its stage and the moves open from it
  branch: null
  pull_request_number: null
  track: record
  depends_on: []
  status: not started
  recommended_model: opus
  notes: 'A validated model on the notes branch beside the hub: goal, sandbox (fork, scratch repository
    or branch), stage, verdict and session. Stages: described, running, accepted, dropped, split, upstream.
    Each stage declares its allowed moves once (described: plan first, experiment first, one PR, fold into an existing plan; running:
    keep iterating, accept, drop, switch to plan first; accepted: split into a plan and implement it,
    open upstream as one PR, keep as a fork-only PR), so the session''s prompt and the hub''s links read
    one source.'
- id: experiment-skill
  title: The session offers the moves at each stage, and /experiment runs one
  branch: null
  pull_request_number: null
  track: record
  depends_on:
  - experiment-record
  status: not started
  recommended_model: sonnet
  notes: 'When a task is described, a rule in plugin/hooks/session-rules.md offers the described stage''s
    moves with a recommended one, before the persistent-plan rule. /experiment (plugin/skills/experiment/SKILL.md)
    opens the sandbox, records the entry and iterates until the user picks a move; at every stage it offers
    that stage''s moves. Drop records the verdict and lists the sandbox''s cleanup steps. Worked example:
    the github-native sandbox in the CRAM fork.'
- id: hub-experiments
  title: The hub lists experiments with their stage and next moves
  branch: null
  pull_request_number: null
  track: hub
  depends_on:
  - experiment-record
  status: not started
  recommended_model: sonnet
  notes: The hub page lists running and accepted experiments, each with its goal, sandbox link, stage,
    verdict and one link per allowed move (Split into a plan, Open upstream, Drop, ...), read from the
    same model as the session's prompt. Dropped and finished experiments sink into a collapsed section.
    On the plan page an accepted experiment's chip offers its two finishing moves, Split into PRs and
    Open in {upstream}, the latter reusing plan-site-ui/promote-button's link.
- id: experiment-split
  title: One session splits an accepted experiment into a plan and implements it
  branch: null
  pull_request_number: null
  track: finishing
  depends_on:
  - experiment-skill
  status: not started
  recommended_model: opus
  notes: From an accepted experiment, one session drafts a plan of independently testable items with tracks
    and waves (through /plan-create, sandbox diff and conversation as source), then implements each item
    from the sandbox's diff, opens the stacked draft PRs and records each one through plan.item_bootstrap
    and the stack tooling. The entry moves to split and links the plan. Switch to plan first on a running
    experiment uses the same path on what exists so far.
- id: experiment-upstream
  title: An accepted experiment opens upstream as one pull request
  branch: null
  pull_request_number: null
  track: finishing
  depends_on:
  - experiment-skill
  status: not started
  recommended_model: sonnet
  notes: Opens the working result as one draft pull request from the fork to the upstream, never pushing
    to the upstream, and records it on the entry, which moves to upstream. Keep as a fork-only PR opens
    it on the fork instead. Shares the promotion path with basstler-v3-stacks/upstream-promotion once
    that lands.

- id: sandbox-ownership
  title: An experiment's sandbox is a plan item from the start, on a descriptive branch
  branch: null
  pull_request_number: null
  track: record
  depends_on:
  - experiment-record
  status: not started
  recommended_model: sonnet
  notes: 'The sandbox branch is owned by an item from the first push and named experiment/<id> at the
    start: renaming it later closes its pull request (goal-paths #232 became #235). Stage and verdict
    are entry fields, not item notes, which hit the 600-character limit. The end is an owner step with
    its own goal, so the session-start goals line and the site show the verdict as the owner''s move;
    nothing else tells the owner an experiment is ready to decide.'

- id: running-stage-rules
  title: The running stage keeps the sandbox splittable, fresh and usable from other sessions
  branch: null
  pull_request_number: null
  track: record
  depends_on:
  - experiment-skill
  status: not started
  recommended_model: sonnet
  notes: 'One commit series per future item, never mixing two. Ask only on design decisions, not after
    every iteration. Merge the default branch into the sandbox at every session start or resume of
    the experiment; its conflicts become the next step. When the experiment changes the plan schema,
    real plans are saved with the sandbox''s tooling, since the release refuses the new fields. Its
    unreleased skills run from another session through the checkout''s plugin folder.'

- id: sandbox-site
  title: The plan site builds from a sandbox only while its experiment runs, and every push rebuilds it
  branch: null
  pull_request_number: null
  track: hub
  depends_on:
  - hub-experiments
  status: not started
  recommended_model: sonnet
  notes: 'While the site repository''s basstler_branch_or_tag names the sandbox, each push to the sandbox
    starts a build; today only plan saves do. The experiment''s moves set that setting to the sandbox
    and back to main, never by hand: it broke when goal-paths'' branch was renamed.'

- id: feedback-intake
  title: Every plan skill starts by taking in the plan's unhandled feedback
  branch: null
  pull_request_number: null
  track: finishing
  depends_on:
  - experiment-skill
  status: not started
  recommended_model: opus
  notes: 'Any plan, not only experiments. Kickoff, resolve, add-plan-item, plan-goal and every plan
    edit start by listing the tracking-issue comments since the plan''s last handled one (a command,
    not a read by eye), then sort each: announcement, an item''s notes, or a structural change asked
    first. The last handled comment is recorded on the plan; session start counts the unhandled ones.
    Today skills read comments only as context for their item, and nothing records what was handled.'

- id: verdict-actions
  title: An owner's verdict step offers Accept & split, Keep iterating and Drop as copyable skill commands
  branch: ccr-a67cc403-e7bqv8
  pull_request_number: null
  track: finishing
  depends_on: []
  status: in progress
  recommended_model: sonnet
  session: https://claude.ai/code/session_018wfiv9k6sCx5uYKVxX4fgM
  notes: 'Feedback from using the goal-paths verdict step: its card only said what to tell a session. An
    owner item with decision: experiment-verdict now shows a button per answer on the plan and goal
    pages, each copying /plan-experiment-verdict <plan>/<item> accept|iterate|drop, with the owner''s
    request appended; iterate refuses to copy without one. Built on experiment/goal-paths, no PR yet.
    The options are fixed in code today; they should come from experiment-record''s declared stage
    moves, as the hub''s links will. goal-paths/verdict does not declare the decision yet.'
