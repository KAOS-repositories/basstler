schema_version: 1
id: goal-paths
title: 'Goal paths: an always-current ordered path to an outcome'
description: 'Ask basstler how to reach an outcome and get the ordered path to it, computed
  from the plans on every build instead of worked out in a chat: a goal names target items
  in any plan, and its path is their dependencies layered into what starts now and what waits,
  with who acts, the command and what blocks each step. Adds steps the owner performs, dependencies
  that require a merge, runnable done checks and a session-close check. Built as an experiment
  first, then split into pull requests.'
default_repository: KAOS-repositories/basstler
tracking_issue: 231
waves:
- id: sandbox
  name: Experiment
  description: The whole design end to end on one sandbox branch, used on real goals.
tracks:
- id: sandbox
  name: Sandbox
  wave: sandbox
items:
- id: experiment
  title: Build goal paths end to end on one sandbox branch and use them on real goals
  track: sandbox
  branch: experiment/goal-paths
  pull_request_number: 235
  depends_on: []
  status: in progress
  recommended_model: opus
  session: https://claude.ai/code/session_018wfiv5szXTK6zAAyzgUyKD
  notes: 'Experiment entry. Sandbox: this branch off main, draft #235 (#232 closed at the rename), never merged. Stage: running.
    Verdict: none (the owner''s step verdict). Seven parts built, one commit series each; they
    become the split''s items. At f3b9f9a0 a path numbers its steps and says whose move each
    is, and a goal page shows its refresh time. Real owner steps are in review-triage. Unverified:
    plugin Stop and PostToolUse hooks in cloud sessions. The plan site builds from this branch
    (stack-board plan-site.yml); set it back to main at accept or drop. Feedback on experiment
    mode goes to #192.'

- id: verdict
  title: Decide the goal-paths experiment - accept and split, drop, or keep iterating
  track: sandbox
  depends_on: []
  status: not started
  performed_by: owner
  decision: experiment-verdict
  notes: 'Yours whenever you have used it enough. Tell a session one of: accept (it splits
    #235 into the seven items as stacked draft pull requests and closes #235), drop (it closes
    #235 and deletes the branch), or keep iterating (say what to change). On accept or drop
    the session sets stack-board''s plan-site.yml back to main and posts the experiment-mode
    feedback on #192, then marks this step done.'

- id: cross-repository-goal-targets
  title: A goal names target items in plans of other repositories
  track: sandbox
  depends_on:
  - verdict
  status: not started
  recommended_model: opus
  notes: 'Built in the experiment at 34cd5bd9 (draft #235): a target or depends_on may be <owner>/<name>:<plan-id>/<item-id>;
    goal set/path/next fetch that repository''s notes branch, and the hub site shares every listed repository''s
    plans and links a step to its card there. goal path kpi-pilot-team-plans prints 12 steps across basstler
    and business_consulting-notes. Next: goal summary still reads only the local plans; split this part
    into its own pull request after the verdict.'

- id: private-goal-issue
  title: A private goal's path is kept in an issue of its notes repository, readable and refreshed from
    any device
  branch: null
  status: not started
  recommended_model: sonnet
  track: sandbox
  depends_on:
  - cross-repository-goal-targets
  notes: 'Found 2026-11-23: the KPI pilot''s goal names items of a private notes repository, so the public
    site cannot show it, and the owner wants it on their phone. Interim: KAOS-repositories/business_consulting-notes
    .github/workflows/goal-page.yml renders goal path --json into issue #1 (on plan saves, every 6 hours,
    on dispatch; needs GOAL_PAGE_TOKEN for private PR states). Ship it: goal path --markdown, and setup
    installs the workflow for a goal kept in a private notes repository.'

- id: unreadable-state-degrades
  title: goal path shows what a token cannot read as unreadable instead of failing
  branch: null
  status: not started
  recommended_model: sonnet
  track: sandbox
  depends_on:
  - cross-repository-goal-targets
  notes: 'Fine-grained tokens have no checks permission, so check-runs answers 403 and goal path crashed.
    Built in the experiment at 8a5765da (#235): check_state reads the commit''s workflow runs (Actions:
    read) on a 403, and reports not reported when those are refused too; business_consulting-notes'' Goal
    page now shows #163''s CI. Next: when a notes repository cannot be fetched, name it instead of reporting
    ''no item of any plan''.'
