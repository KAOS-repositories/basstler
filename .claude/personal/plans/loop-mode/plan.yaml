schema_version: 1
id: loop-mode
title: 'Loop mode: loops whose checkpoints the user sets and whose guardrails hooks enforce'
description: >-
  Loop mode runs an agent in a loop the user designed. A guided /loop-mode skill has the user set
  every human checkpoint - goal and stop condition, checker, intent, budgets and autonomy, and how
  the result is accepted - suggesting answers from the repository and answering their questions,
  then shows the seven default run-time guardrails to keep, modify or extend. Hooks enforce the
  guardrails and the stop condition, a report hands the result back, and plan items gain a loop
  execution mode.
default_repository: KAOS-repositories/basstler
tracking_issue: 332
waves:
- id: contract
  name: The loop contract
  description: The user's checkpoints and guardrails as data, set through a guided skill.
- id: enforcement
  name: Guardrails enforced
  description: Hooks enforce the guardrails and the stop condition while a loop runs.
- id: acceptance
  name: After the loop
  description: The result handed back to the user, and plan items run in loop mode.
tracks:
- id: contract
  name: Contract and guided setup
  wave: contract
- id: tool-guardrails
  name: Tool-call guardrails
  wave: enforcement
- id: stop-guardrails
  name: Stop decisions
  wave: enforcement
- id: acceptance
  name: Acceptance
  wave: acceptance
- id: plan-items
  name: Plan items in loop mode
  wave: acceptance
items:
- id: loop-contract
  title: Model the loop contract - the checkpoints the user sets and the run-time guardrails with their defaults
  track: contract
  depends_on: []
  status: not started
  recommended_model: opus
  notes: New distribution packages/loop (basstler-loop) with its PackageContribution. LoopContract
    holds the before-run checkpoints (goal and stop condition, checker, intent, budgets and autonomy)
    and the after-run ones (merge policy, review, output cap, audit cadence) with no defaults, so a
    contract without the user's answers cannot be built. RunGuardrail lists the seven run-time
    guardrails, each with a default the user keeps, changes or extends. Stored per loop on the notes
    branch; basstler loop guardrails, save and show.
- id: checkpoint-suggestions
  title: Suggest answers for each checkpoint from the repository
  track: contract
  depends_on:
  - loop-contract
  status: not started
  recommended_model: sonnet
  notes: basstler loop suggest prints, per checkpoint, suggestions read deterministically from the
    repository - test and lint commands from pyproject.toml, basstler code-rules check, the CI
    workflows' checks, the checker's own paths (tests, CI and linter config, rule files) as protected
    paths, and the dependency files. A suggestion is an offer, never an answer - the contract still
    needs the user's choice. Tests on fixture repositories.
- id: loop-mode-skill
  title: /loop-mode guides the user through every checkpoint and the default guardrails, then starts the loop
  track: contract
  depends_on:
  - loop-contract
  - checkpoint-suggestions
  status: not started
  recommended_model: opus
  notes: LoopModeSkill in the contribution, SKILL.md body by hand, and checkpoints.md explaining each
    checkpoint and the rule of thumb (automate what a machine checks, escalate judgement and
    irreversible steps, keep done, checker and acceptance for humans). One checkpoint at a time via
    AskUserQuestion with the suggestions; answers the user's questions before moving on; never fills
    one itself. Shows the seven guardrails to keep, modify or append, saves the contract, marks the
    loop active and starts it.
- id: guardrail-tool-hook
  title: Block tool calls that cross a guardrail while a loop runs
  track: tool-guardrails
  depends_on:
  - loop-mode-skill
  status: not started
  recommended_model: sonnet
  notes: A PreToolUse hook declared in the contribution reads the active contract and denies, naming
    the guardrail and the user's next step - an edit to a protected checker path (guardrail 3), a
    dependency or out-of-scope change (4), an irreversible or outward-facing command such as push,
    merge, release, delete or secrets (5). A denied permission (7) ends the iteration and is recorded,
    never worked around. Inactive outside a loop. Tests on recorded hook payloads.
- id: guardrail-stop-hook
  title: Decide at every stop whether the loop continues, ends or hands over to the user
  track: stop-guardrails
  depends_on:
  - loop-mode-skill
  status: not started
  recommended_model: opus
  notes: A Stop hook runs the contract's deterministic checker; a met stop condition ends the loop.
    Otherwise it continues unless the same failure repeats or the diff is unchanged (guardrail 1), a
    budget passes its warning share, default 80% (2), or the deterministic checks and the checker
    subagent's recorded verdict disagree (6) - then it stops and hands over with the reason. Each
    iteration's checker result, diff hash, turns and cost go to a run log every decision is computed
    from. Tests over fixture logs.
- id: loop-acceptance
  title: Hand the finished loop to the user - report, merge gate, output cap and audit
  track: acceptance
  depends_on:
  - guardrail-stop-hook
  status: not started
  recommended_model: sonnet
  notes: When a loop ends, basstler loop report prints from the run log what it did, its cost, every
    hand-over and why it stopped, and says merging is the user's call under the contract's merge
    policy. A new loop is refused while the user's unreviewed loop pull requests reach the contract's
    output cap. At the contract's audit cadence it lists merged loop output to sample. Tests on
    fixture logs and mocked GitHub pull request lists.
- id: plan-item-loop-mode
  title: Add loop as a fourth plan-item execution mode
  track: plan-items
  depends_on:
  - guardrail-tool-hook
  - guardrail-stop-hook
  status: not started
  recommended_model: sonnet
  notes: plan.item_mode accepts loop beside auto, plan and ask, and /plan-item-mode pins it. In loop
    mode kickoff and resolve run /loop-mode for the item first, offering the item's notes and the
    repository rules as suggestions for its goal and checker, then work the item inside that loop.
    Updates execution-modes.md; basstler-plan gains a dependency on basstler-loop. Tests on mode
    resolution and the kickoff brief.
