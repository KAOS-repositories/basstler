schema_version: 1
id: loop-review-quality
title: 'Loop review quality: better reviews and loop runners, chosen after the first agentic loop run'
description: Refinements to the agentic loop, reprioritised from what its first end-to-end run shows - a
  review that finds, refutes and ranks its findings, reviews of only what changed since the last round,
  a model of its own for the review stage, and alternative runners for the whole loop.
default_repository: KAOS-repositories/basstler
waves:
- id: refinement
  name: Refinement after the first run
  description: Better reviews, chosen by what the first run shows.
- id: options
  name: Options kept in reserve
  description: Alternative runners, taken up once the chain is proven.
tracks:
- id: review-quality
  name: Review quality
  wave: refinement
- id: loop-alternatives
  name: Loop alternatives
  wave: options
items:
- id: review-workflow
  title: Run the review stage as a dynamic workflow that finds, verifies and ranks
  branch: null
  status: not started
  recommended_model: opus
  track: review-quality
  depends_on:
  - agentic-loops/loop-end-to-end
  notes: /plan-item-review runs a Claude Code dynamic workflow - one finder per changed file, an agent that
    tries to refute each finding at the head SHA, then a ranking - returning a schema-checked {blocking, findings}.
    It replaces only the /code-review and AGENTS.md judgement steps; basstler code-rules check keeps running
    deterministically on the changed lines.
    Shipping a workflows/ folder in the plugin needs the AGENTS.md package rule changed first; ask before.
    Test the skill's handling of the workflow's JSON with fixtures.
- id: delta-review
  title: Review only what changed since the last reviewed commit, from round 2 on
  branch: null
  status: not started
  recommended_model: sonnet
  track: review-quality
  depends_on:
  - agentic-loops/loop-end-to-end
  notes: From round 2 the review reads the diff from the previous round's reviewed SHA, plus whether each
    earlier thread was addressed, judged with the resolve's reply on it. Test that unchanged code accepted
    in round 1 gets no new finding in round 2.
- id: review-model
  title: Let the review stage run on its own model
  branch: null
  status: not started
  recommended_model: sonnet
  track: review-quality
  depends_on:
  - agentic-loops/loop-end-to-end
  notes: An optional review model in the loop contract, passed as create_session's model in the cloud and
    --model locally; unset keeps today's behaviour. Tests on the rendered cloud request and the local command
    line.
- id: workflow-loop-trial
  title: Try one review-resolve loop as a single dynamic workflow beside the session chain
  branch: null
  status: not started
  recommended_model: opus
  track: loop-alternatives
  depends_on:
  - agentic-loops/loop-end-to-end
  - review-workflow
  notes: Run one item's whole loop as a workflow with its stop rules and guardrails in the script and compare
    it with the chain on hand-over failures, cost and whether its agents can follow the resolve skill. A new
    loop kind - propose on agentic-loops' tracking issue first. Keep or drop it from the comparison.
- id: event-driven-runner
  title: Host the loop stages in a GitHub Actions runner triggered by pull request events
  branch: null
  status: deferred
  recommended_model: opus
  track: loop-alternatives
  depends_on:
  - agentic-loops/loop-end-to-end
  notes: Kept in reserve for loops that must outlive a closed computer or run for a team, via claude-code-action
    on pull_request_review. Deferred because it relies on GitHub's scheduler, against the determinism rule;
    reconsider only if the chain proves insufficient.
