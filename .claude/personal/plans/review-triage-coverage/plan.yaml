  - review-triage-stack/reexported-imports
  status: in progress
  recommended_model: sonnet
  notes: 'Draft #317 at 2b783e24 on #311. A name only the head imports is mechanical when its code uses
    it only as whole decorators whose source member the base commit defines as an identity function.
    Turns 7 of CRAM 1062''s files mechanical.'
- id: rejection-reasons
  title: Name the reason for every file that needs review
