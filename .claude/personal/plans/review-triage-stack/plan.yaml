schema_version: 1
id: review-triage-stack
title: 'Review triage stack: every triage feature restacked on main, so mark-viewed proves #297 and CRAM
  1019'
description: The open triage pull requests restacked on main as one chain, each new proof its own draft
  pull request, with claude/practical-hawking-nf0g3o holding them all; mechanical files are marked viewed
  with no false positives, on Windows and Ubuntu.
default_repository: KAOS-repositories/basstler
waves:
- id: stack
  name: Restacked triage
tracks:
- id: stack
  name: One chain from main
  wave: stack
items:
- id: viewed-state-start
  title: Start each file's triage from where its reviewer last viewed it
  branch: review-triage-viewed-state-start
  track: stack
  depends_on:
  - member-moves
  status: in progress
  recommended_model: opus
  notes: 'Draft #303 at 68105e99 on #302. One paged GraphQL snapshot reads headRefOid and each file''s
    viewerViewedState: VIEWED skipped, UNVIEWED from the merge base, DISMISSED from the latest checkpoint
    head where it was VIEWED. Marking stops if headRefOid moved.'
  pull_request_number: 303
  session: https://claude.ai/code/session_01JxHGiMaBTJPWdiw5tn4mNv
- id: triage-integration
  title: One branch with every open triage pull request, on main
  track: stack
  branch: review-triage-integration
  pull_request_number: 299
  session: https://claude.ai/code/session_01JxHGiMaBTJPWdiw5tn4mNv
  depends_on:
  - review-triage/binding-renames
  - review-triage/markdown-binding-renames
  - review-triage/move-split
  - review-triage/per-reviewer-viewed-marking
  status: in progress
  recommended_model: sonnet
  notes: 'Draft #299 at 4263bc13: the base of the restacked triage stack (#300-#313). claude/practical-hawking-nf0g3o
    holds #309 + #311-#314.'
