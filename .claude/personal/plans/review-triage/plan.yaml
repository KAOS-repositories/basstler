schema_version: 1
id: review-triage
title: 'Review triage: mechanical files proven and marked viewed'
description: A pull request's files whose change is provably only imports, a PR-wide rename
  or docstring and comment formatting are classified as mechanical, listed in a CI summary,
  and marked viewed for the reviewer, so review time goes to the files that changed behaviour.
default_repository: KAOS-repositories/basstler
waves:
- id: triage
  name: Triage
tracks:
- id: triage
  name: Classify, report and mark viewed
  wave: triage
- id: pattern-fixes
  name: Rule fixes applied and proven mechanical
  wave: triage
- id: windows
  name: The Windows fixes the triage is proven on
  wave: triage
items:
- id: keyword-argument-triage
  title: Prove keyword-argument conversions mechanical
  track: triage
  depends_on:
  - move-triage
  status: in progress
  recommended_model: sonnet
  branch: ccr-37402cb7-cls5ht-keyword-arguments
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  pull_request_number: 214
  notes: 'Draft #214, stacked on #213: signature-checked keyword-argument judgment, and rename
    sources for module moves, definitions moved between modules and moved file paths in prose;
    relative imports resolved per file, templates and empty package initializers judged. CRAM
    #967: 123 of 154 files mechanical; #210: 233 of 246.


    Split: the moves and the general triage go to move-triage; #214 is restacked onto it and
    keeps keyword_arguments, calls, signatures and tree_matching with their tests and datasets,
    supplying KeywordArgumentComparison.'
- id: viewed-marking-workflow
  title: Mark files viewed on every pull request, from Actions or your own computer
  track: triage
  blockers:
    - >-
      83 unresolved threads in the owner's review of 1c54d6ff: local fixes, questions, and a call to
      remodel GitHub settings, readers/writers, tokens, secrets, forms and user steps codebase-wide.
      That remodel's scope and order versus the local fixes await the user.
    - >-
      Owner rejects committing the workflow to a fork's default branch (viewed_setup.py:323,
      setup-review-triage SKILL.md:112). Clean with main at 73801cd6 (head 7f6928a5); CI there still
      running when read.
  depends_on: []
  status: blocked
  recommended_model: sonnet
  branch: ccr-37402cb7-cls5ht-viewed-workflow
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  pull_request_number: 215
  notes: >
    Draft #215, now on main (#213 merged): set-up-mark-viewed installs the workflow (on every pull
