schema_version: 1
id: review-triage
title: 'Review triage: mechanical files proven and marked viewed'
description: A pull request's files whose change is provably only imports, a PR-wide rename
  or docstring and comment formatting are classified as mechanical, listed in a CI summary,
  and marked viewed for the reviewer, so review time goes to the files that changed behaviour.
default_repository: KAOS-repositories/basstler
waves:
- id: triage
  name: Triage
tracks:
- id: triage
  name: Classify, report and mark viewed
  wave: triage
- id: windows
  name: The Windows fixes the triage is proven on
  wave: triage
items:
- id: keyword-argument-triage
  title: Prove keyword-argument conversions mechanical
  track: triage
  depends_on:
  - move-triage
  status: in progress
  recommended_model: sonnet
  branch: ccr-37402cb7-cls5ht-keyword-arguments
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  pull_request_number: 214
  notes: 'Draft #214, stacked on #226 and restacked onto it by merge at f7d1e807 (175 triage
    and git tests, ruff and code-rules pass on Windows; CI not read). Keeps keyword_arguments,
    calls, signatures and tree_matching, supplying KeywordArgumentComparison and the call
    resolution binding-renames builds on. CRAM #967: 123 of 154 files mechanical; #210: 233
    of 246.'
- id: viewed-marking-workflow
  title: Mark files viewed on every pull request, from Actions or your own computer
  track: triage
  blockers:
    - >-
      83 unresolved threads in the owner's review of 1c54d6ff: local fixes, questions, and a call to
      remodel GitHub settings, readers/writers, tokens, secrets, forms and user steps codebase-wide.
      That remodel's scope and order versus the local fixes await the user.
    - >-
      Owner rejects committing the workflow to a fork's default branch (viewed_setup.py:323,
      setup-review-triage SKILL.md:112). Clean with main at 73801cd6 (head 7f6928a5); CI there still
      running when read.
  depends_on: []
  status: blocked
  recommended_model: sonnet
  branch: ccr-37402cb7-cls5ht-viewed-workflow
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  pull_request_number: 215
  notes: >
    Draft #215, now on main (#213 merged): set-up-mark-viewed installs the workflow (on every pull
    request with --on-every-pull-request), turns Actions on for forks and lists the token steps
    left; mark-viewed falls back to Actions and names both routes and the README when neither works.
    The user says the token is stored (not checked from a cloud session).

    #221 merges only after #215: #221's mark-viewed.yml calls #215's reusable
    review-triage-mark-viewed.yml.
- id: move-triage
  title: Prove module, definition and file moves mechanical
  track: triage
  branch: claude/youthful-babbage-btoebw
  pull_request_number: 226
  session: https://claude.ai/code/session_018wfiv8MVHyrTDcHrfEBtkJ
  depends_on: []
  status: in progress
  recommended_model: sonnet
  notes: 'The general part of #214 (moves, triage since a commit, opt-in rules), split out
    by moving files. report and mark-viewed now default to the viewer''s last submitted
    review, else the merge base; --from-merge-base asks for the whole change. Next: read CI;
    restack #214 onto it, which lacks ee81557b. Exempt from the basstler-packages freeze
    on github.'

- id: generated-file-triage
  title: Prove a generated file mechanical by regenerating it
  track: triage
  depends_on:
  - move-triage
  status: not started
  recommended_model: sonnet
  notes: A file the repository generates, starting with AGENTS.md from basstler code-rules
    agents-md (code_rules/command_line.py generate_agents_instructions), is mechanical when
    regenerating it from the head's sources reproduces the head's file. Each generated file
    and its generator are declared once, not hardcoded in the triage.

- id: windows-suite
  title: Make the suite pass on Windows
  track: windows
  depends_on: []
  status: in progress
  recommended_model: sonnet
  branch: fix-windows-test-failures
  pull_request_number: 220
  notes: 'Draft #220, main merged at b2bb4d75; last Windows run 39 failed, 2712 passed. Runs on a Windows
    machine (.venv/Scripts/python.exe). Next, in order: install-lock liveness (kill -0 sees MSYS PIDs);
    session start on Scripts/python.exe environments and their removal; GH_CONFIG_DIR at a temporary
    folder for no-credential tests; the no-upstream remote test; skip the ~20 gh/bash stub tests on
    win32, naming the limit. Push only through basstler.sh maintenance push; a push restacks #222 and
    clears Viewed. Update these notes per push; after this order''s last push, run goal pushes-done
    on this item.'
- id: actions-marking
  title: Install the mark-viewed workflow in this repository
  track: triage
  branch: basstler/mark-viewed
  pull_request_number: 221
  depends_on:
  - viewed-marking-workflow
  status: in progress
  recommended_model: haiku
  notes: 'Open #221, written by set-up-mark-viewed. Its mark-viewed.yml calls #215''s reusable
    review-triage-mark-viewed.yml, so the owner merges it only after #215 has merged. Needs
    the REVIEW_TRIAGE_VIEWER_TOKEN secret stored by the owner.'

- id: mark-220-viewed
  title: 'Mark #220''s mechanical files viewed'
  track: windows
  depends_on:
  - windows-suite
  - code-rule-fixes/rule-fix-triage
  depends_on_merged:
  - code-rule-fixes/rule-fix-triage
  depends_on_pushes_done:
  - windows-suite
  status: not started
  performed_by: owner
  commands:
  - basstler review-triage report 220
  - basstler review-triage mark-viewed 220
  notes: 'Run on your own computer, from a checkout that has rule-fix-triage merged, and before you
    review #220: it shrinks that review''s diff. It waits for windows-suite''s last push to be recorded
    (goal pushes-done), and waits again if #220 is pushed after it, since every push clears Viewed.
    The report lists what will be marked; read it before marking.'
- id: move-split
  title: Split every proven mechanical change out of a pull request, and leave one sample
    per rename unviewed
  track: triage
  branch: review-triage-split-moves
  pull_request_number: 241
  depends_on:
  - move-triage
  - binding-renames
  status: in progress
  recommended_model: opus
  notes: 'Draft #241 at 15dee971, on #226. split-mechanical: statement-level mechanical
    commit proven with the PR''s renames, head tree after, summary in the description.
    Samples: one unviewed file per rename. Local splits: CRAM 609 3435 to 1455 lines,
    business_consulting 125 2757 to 2084. CI not read. Next: restack onto binding-renames
    once it is built, adapting SourceRenaming, the samples and the summary to binding renames.'

- id: binding-renames
  title: Prove a rename of one class, function, attribute, parameter or variable mechanical
  track: triage
  branch: review-triage-binding-renames
  pull_request_number: 253
  session: local_d7fe7b54-32e5-46ac-b1a1-e8cac12d7aa6
  depends_on:
  - keyword-argument-triage
  status: in progress
  recommended_model: opus
  notes: 'Stacked on #214; #241 restacks onto it. A rename belongs to a binding, not a word:
    each old token resolves to its binding (symtable, DefinitionIndex for self/cls, #214''s
    call resolution for keywords), accepted when every occurrence changes alike without
    capture. An unresolved receiver''s attribute passes only when every repository class with
    that member renames it alike; prose only in the binding''s scope or qualified references.
    Done when business_consulting #125''s evaluation.py shows only its models change.'
landed_item_count: 1
