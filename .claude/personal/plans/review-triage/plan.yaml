    Samples: one unviewed file per rename. Local splits: CRAM 609 3435 to 1455 lines, business_consulting
    125 2757 to 2084. CI not read. Next: restack onto binding-renames once it is built, adapting
    SourceRenaming, the samples and the summary to binding renames.'
