schema_version: 1
id: review-triage
title: 'Review triage: mechanical files proven and marked viewed'
description: A pull request's files whose change is provably only imports, a PR-wide rename
  or docstring and comment formatting are classified as mechanical, listed in a CI summary,
  and marked viewed for the reviewer, so review time goes to the files that changed behaviour.
default_repository: KAOS-repositories/basstler
waves:
- id: triage
  name: Triage
tracks:
- id: triage
  name: Classify, report and mark viewed
  wave: triage
- id: pattern-fixes
  name: Rule fixes applied and proven mechanical
  wave: triage
items:
- id: mechanical-file-triage
  title: Classify mechanical files, summarise them in CI and mark them viewed
  track: triage
  blockers:
    - >-
      One open review thread on #213 asks the reviewer whether the existing of/at methods are
      renamed here or separately (discussion_r4573303623). Merged with main and CI-pending at
      d9a49529.
  depends_on: []
  status: in progress
  recommended_model: sonnet
  branch: ccr-37402cb7-cls5ht
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  pull_request_number: 213
  notes: 'Draft #213: basstler-review-triage distribution with FileJudgment, ChangeKind,
    RenameSource and TriageOutput extension points, a CI summary in the lint job, and
    mark-viewed for a local machine (cloud sessions refuse GraphQL).'

- id: keyword-argument-triage
  title: Prove keyword-argument conversions and module moves mechanical
  track: triage
  depends_on: [mechanical-file-triage]
  status: in progress
  recommended_model: sonnet
  branch: ccr-37402cb7-cls5ht-keyword-arguments
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  pull_request_number: 214
  notes: 'Draft #214, stacked on #213: signature-checked keyword-argument judgment, and
    rename sources for module moves, definitions moved between modules and moved file
    paths in prose; relative imports resolved per file, templates and empty package
    initializers judged. CRAM #967: 123 of 154 files mechanical; #210: 233 of 246.'

- id: viewed-marking-workflow
  title: Mark files viewed on every pull request, from Actions or your own computer
  track: triage
  depends_on: [mechanical-file-triage]
  status: in progress
  recommended_model: sonnet
  branch: ccr-37402cb7-cls5ht-viewed-workflow
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  pull_request_number: 215
  notes: 'Draft #215, stacked on #213: set-up-mark-viewed installs the workflow (on
    every pull request with --on-every-pull-request), turns Actions on for forks and
    lists the token steps left; mark-viewed falls back to Actions and names both routes
    and the README when neither works. Waits on the user storing the token.' 

- id: rule-fixes
  title: Declare reversible fixes on code rules and apply them with code-rules fix
  track: pattern-fixes
  status: in progress
  branch: claude/pattern-checkers-mechanical-marking-arg9pe
  session: https://claude.ai/code/session_01JxHGiQ6QwrU1DCxnD3WaYc
  notes: 'Stacked on #220 (its checkers). Takes krracker''s design (specifications,
    actions, plans, reversal) into basstler.code_modification on libcst, without the
    role transformations. A checker reports specifications, a rule declares its fix and
    the behaviour it preserves or changes, with examples tested automatically. First
    fix: text read and written as UTF-8.'

- id: directory-and-bash-fixes
  title: Fixes for directory removal and bash started by name
  track: pattern-fixes
  depends_on: [rule-fixes]
  status: not started
  notes: 'rmtree(x) becomes DirectoryTree(x).remove(); with ignore_errors=True the fix
    keeps ignoring errors through a declared DirectoryTree option, unless the rule wants
    it to raise, and declares that. Bash.locate fix only where an environment is in scope.'

- id: rule-fix-triage
  title: Prove a file mechanical when its change is a rule's fix
  track: pattern-fixes
  depends_on: [keyword-argument-triage, rule-fixes]
  status: not started
  notes: 'basstler-review-triage depends on basstler-rules. The triage recomputes each
    fix from the base and allows the difference where it reproduces the head, alongside
    renames and imports; a new change kind names the rule. Rule-fix files are marked
    viewed like other mechanical kinds. Expect most of #220 mechanical.'

- id: reduced-review-diff
  title: Show a reviewer only what is left once rule fixes are reversed
  track: pattern-fixes
  depends_on: [rule-fix-triage]
  status: not started
  notes: 'For a file mixing a rule fix and a real change, reverse the fix''s actions on
    the head and show the remaining diff against the base in the report.'
