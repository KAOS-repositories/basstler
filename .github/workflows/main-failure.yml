name: Main's failure issue

# One issue stays open while main's tests fail: the first failed push opens it, later
# ones comment on it, and the next push whose tests pass closes it.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

concurrency:
  group: main-failure
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  record:
    name: Open, comment on or close the issue
    if: github.event.workflow_run.event == 'push' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: basstler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Every distribution, at the versions uv.lock names, into the interpreter
      # setup-python put on PATH.
      - name: Install basstler
        run: |
          python -m pip install uv
          UV_PROJECT_ENVIRONMENT="$(python -c 'import sys; print(sys.prefix)')" \
            uv sync --frozen --package basstler --no-dev --project basstler

      - name: Record the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m basstler.github.main_failure record
          --repository "${{ github.repository }}"
          --run "${{ github.event.workflow_run.id }}"
          --commit "${{ github.event.workflow_run.head_sha }}"
          --conclusion "${{ github.event.workflow_run.conclusion }}"
