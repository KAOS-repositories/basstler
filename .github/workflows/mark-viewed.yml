# Installed by `basstler review-triage set-up-mark-viewed`. It marks a pull request's
# mechanical files viewed for the owner of the token stored as REVIEW_TRIAGE_VIEWER_TOKEN;
# `basstler review-triage mark-viewed` starts it where it cannot mark them itself. It
# runs basstler's main; to pin a release, put its tag wherever that appears below.
name: Mark viewed

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The number of the pull request whose mechanical files to mark viewed"
        required: true
        type: string
      repository:
        description: "The owner/name repository the pull request is opened on"
        required: true
        type: string

concurrency:
  group: mark-viewed-${{ inputs.pull_request }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mark:
    uses: ./.github/workflows/review-triage-mark-viewed.yml
    with:
      basstler_branch_or_tag: main
      pull_request: ${{ inputs.pull_request }}
      repository: ${{ inputs.repository }}
    secrets:
      viewer_token: ${{ secrets.REVIEW_TRIAGE_VIEWER_TOKEN }}
