# Written by basstler's /setup-personal-notes; re-run it to update this file rather than
# editing it here.
name: Plan site merge dispatch

# Every pull request opened, reopened, marked ready, turned back into a draft, merged or
# closed, a fork's included, starts the plan site's build in AbdelrhmanBassiouny/stack-board, so the
# site shows its state without waiting for the next push to the notes branch. It runs on
# pull_request_target to read the token for a fork's pull request too; it checks out
# nothing and reads nothing the pull request controls.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions: {}

concurrency:
  group: plan-site-merge
  cancel-in-progress: true

jobs:
  dispatch:
    name: Start the plan site build
    if: github.repository == 'KAOS-repositories/basstler'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the build
        env:
          GH_TOKEN: ${{ secrets.PLAN_SITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PLAN_SITE_TOKEN is not stored::KAOS-repositories/basstler stores no PLAN_SITE_TOKEN secret, so this run started no build in AbdelrhmanBassiouny/stack-board. Run /setup-personal-notes, or create the token at https://github.com/settings/personal-access-tokens/new?name=basstler%20plan%20site&description=Starts%20the%20plan%20site%20build%20in%20AbdelrhmanBassiouny%2Fstack-board&target_name=AbdelrhmanBassiouny&actions=write and store it at https://github.com/KAOS-repositories/basstler/settings/secrets/actions/new"
            exit 1
          fi
          gh workflow run plan-site.yml --repo AbdelrhmanBassiouny/stack-board
