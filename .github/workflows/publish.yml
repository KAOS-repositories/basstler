name: Publish

# Every release is published to PyPI, every distribution at the release's version, and
# the plan service's image to the GitHub Container Registry. The files are built once
# from the tagged commit and published to PyPI through trusted publishing, and the image
# is pushed with the run's own token, so no token is stored anywhere. Each distribution publishes from an
# environment of its own, pypi-<distribution>, because PyPI takes a pending publisher
# for one new project only per workflow and environment.
#
# The release workflow moves the release branch to the tag it makes, so the branch is
# what a finished release run publishes. A release whose publishing stopped is finished
# by running this workflow by hand with its tag: the next release run finds nothing new
# to tag, and files an index already holds are skipped.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish; the latest release when empty.
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The branch the release workflow keeps at the latest release.
  RELEASE_BRANCH: release

jobs:
  build:
    name: Build every distribution of the release
    if: >-
      !github.event.repository.fork &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      distributions: ${{ steps.distributions.outputs.names }}
    steps:
      # The version is read from the tag, so the whole history comes with the checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A commit that no release tags has nothing to publish; building it would name a
      # development version.
      - name: Require a release tag at the commit
        run: git describe --tags --exact-match --match 'v*'

      - name: Build
        run: |
          python -m pip install uv
          uv build --all-packages --out-dir dist

      # The names of the distributions built, as the JSON list the publish job's matrix
      # takes.
      - name: List the distributions
        id: distributions
        run: |
          names=$(for wheel in dist/*.whl; do basename "$wheel" | cut -d- -f1 | tr _ -; done | sed 's/.*/"&"/' | paste -sd, -)
          echo "names=[$names]" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish ${{ matrix.distribution }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(needs.build.outputs.distributions) }}
    environment: pypi-${{ matrix.distribution }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: built/

      # A file's name spells the distribution with underscores, followed by its version.
      - name: Keep only this distribution's files
        id: files
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          mkdir dist
          mv "built/${DISTRIBUTION//-/_}"-[0-9]* dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # The plan service's image, under the repository's own name, pushed with the run's own
  # token. The registry's names are lower case, however the owner spells its name.
  publish-image:
    name: Publish the plan service's image to the GitHub Container Registry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # The commit the release run tagged, or the tag named by hand.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Build and push the image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git describe --tags --exact-match --match 'v*')"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/basstler-hub-server"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build -f packages/hub-server/Dockerfile --build-arg VERSION="${version}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${image}:${version}" -t "${image}:latest" .
          docker push --all-tags "${image}"
          echo "Published ${image}:${version}." >> "${GITHUB_STEP_SUMMARY}"
