name: Review triage split mechanical

# Adds commits on top of a pull request's branch splitting it into the changes basstler
# review-triage proves mechanical and the rest: one showing every other change of the
# pull request, and one showing every other change pushed since the previous split.
# Nothing is rewritten; the author's next pull fast-forwards.
#
# Reusable: a repository calls it from a workflow of its own, as basstler's
# split-mechanical.yml does on every push once the author adds the split-mechanical
# label.

on:
  workflow_call:
    inputs:
      basstler_branch_or_tag:
        description: "The basstler branch or tag to run, the same one the caller uses this workflow at"
        required: true
        type: string
      pull_request:
        description: "The number of the pull request to split"
        required: true
        type: string
      repository:
        description: "The owner/name repository the pull request is opened on"
        required: true
        type: string
      requested_by_label:
        description: "Whether adding the label started the run, which only the pull request's author may do"
        required: false
        default: false
        type: boolean
    secrets:
      push_token:
        description: "A token that may push to the pull request's branch, also one in a fork; a push with the Actions token starts no checks"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  split:
    name: Split off the mechanical changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Splitting is the author's choice, so only the author may switch it on by adding
      # the label; a push to a branch it is on is split for whoever pushed.
      - name: Check the pull request's author added the label
        id: author
        if: inputs.requested_by_label
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          AUTHOR="$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST" --jq .user.login)"
          if [ "$AUTHOR" != "$GITHUB_ACTOR" ]; then
            MESSAGE="Only $AUTHOR, the pull request's author, may switch splitting on; $GITHUB_ACTOR added the label, so its branch is unchanged."
            echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$MESSAGE"
            exit 1
          fi

      # The split reads the pull request's commits with history and runs none of their
      # code, so a pull_request_target caller is safe.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          token: ${{ secrets.push_token || github.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Every distribution of that branch or tag, at the versions its uv.lock names,
      # into the interpreter setup-python put on PATH.
      - name: Install basstler
        run: |
          set -euo pipefail
          python -m pip install uv
          git clone --quiet --depth 1 --branch "${{ inputs.basstler_branch_or_tag }}" \
            https://github.com/KAOS-repositories/basstler "${RUNNER_TEMP}/basstler"
          UV_PROJECT_ENVIRONMENT="$(python -c 'import sys; print(sys.prefix)')" \
            uv sync --frozen --package basstler --no-dev --no-editable \
            --project "${RUNNER_TEMP}/basstler"

      # The commits are made by whoever started the run: the author who added the
      # label, or whoever pushed.
      - name: Split
        id: split
        env:
          GH_TOKEN: ${{ secrets.push_token || github.token }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          python -m basstler review-triage split-mechanical "$PULL_REQUEST" \
            --repository "$REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

      # A label someone else added would split every later push, so it goes.
      - name: Remove a label the author did not add
        id: label
        if: failure() && steps.author.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          gh api -X DELETE "repos/$REPOSITORY/issues/$PULL_REQUEST/labels/split-mechanical" \
            --silent
