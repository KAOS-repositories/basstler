name: Split mechanical

# Once a pull request's author adds the split-mechanical label, and on every push while
# it stays on, add commits splitting the pull request into the changes basstler proves
# mechanical and the rest. Removing the label stops it. Storing a
# REVIEW_TRIAGE_SPLIT_TOKEN that may push to the pull request's branch lets it split a
# pull request from a fork, and starts the checks on the new head.

on:
  pull_request_target:
    types: [labeled, synchronize]

# A newer push cancels a split still running: the next split starts from the newest one
# in the branch's history, so it takes the cancelled push's changes in.
concurrency:
  group: split-mechanical-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  split:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'split-mechanical')
      || (github.event.action == 'synchronize'
      && contains(github.event.pull_request.labels.*.name, 'split-mechanical'))
    uses: ./.github/workflows/review-triage-split-mechanical.yml
    with:
      basstler_branch_or_tag: main
      pull_request: ${{ github.event.pull_request.number }}
      repository: ${{ github.repository }}
      requested_by_label: ${{ github.event.action == 'labeled' }}
    secrets:
      push_token: ${{ secrets.REVIEW_TRIAGE_SPLIT_TOKEN }}
