name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  usage:
    name: Actions usage
    if: github.event_name != 'push' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      over_budget: ${{ steps.measure.outputs.over_budget }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: basstler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler
        run: |
          python -m pip install uv
          UV_PROJECT_ENVIRONMENT="$(python -c 'import sys; print(sys.prefix)')" \
            uv sync --frozen --package basstler --no-dev --project basstler

      # A measurement that fails never blocks the tests: no output reads as within budget.
      - name: Measure the last 24 hours of runs against the budget
        id: measure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m basstler.github.actions_usage --repository "${{ github.repository }}" --github-actions

  lint:
    name: ruff
    if: github.event_name != 'push' || !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      # The base commit is checked out in a worktree to compare its crossings.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Every distribution and the development tools, at the versions uv.lock names,
      # into the interpreter setup-python put on PATH.
      - name: Install the workspace and the development tools
        run: |
          python -m pip install uv
          UV_PROJECT_ENVIRONMENT="$(python -c 'import sys; print(sys.prefix)')" \
            uv sync --frozen --all-packages

      - name: Check the lock is up to date
        run: uv lock --check

      - name: Check the code rules
        run: ruff check .

      - name: Check the formatting
        run: ruff format --check .

      - name: Fail on a crossing the base does not have
        run: python -m basstler code-rules new-crossings "$BASE_COMMIT"

  # Past a daily ceiling a pull request's matrix is skipped, unless it carries the
  # budget-override label. A push to main always runs it, since its pass is what releases.
  test:
    name: pytest on Python ${{ matrix.python-version }}
    needs: usage
    if: >-
      (github.event_name != 'push' || !github.event.repository.fork) &&
      (github.event_name == 'push' ||
      needs.usage.outputs.over_budget != 'true' ||
      contains(github.event.pull_request.labels.*.name, 'budget-override'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # The tags give the installed package its release version, which the tests read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      # Each distribution's tests run in an environment of their own, holding only the
      # distribution and what its pyproject.toml lists for it and its tests, and all of
      # them run on any change. The hook tests run python3 from the path, so the
      # environment's interpreter is put first on it.
      - name: Run each distribution's tests on its own
        run: |
          failed=""
          for directory in packages/*/; do
            part="$(basename "${directory}")"
            name="$(sed -n 's/^name = "\(.*\)"$/\1/p' "${directory}pyproject.toml" | head -1)"
            environment="${RUNNER_TEMP}/environments/${part}"
            echo "::group::${name}"
            UV_PROJECT_ENVIRONMENT="${environment}" uv sync --frozen --package "${name}" \
              --python "${{ matrix.python-version }}"
            if [ -x "${environment}/bin/playwright" ]; then
              "${environment}/bin/python" -m playwright install --with-deps chromium
            fi
            PATH="${environment}/bin:${PATH}" "${environment}/bin/python" -m pytest \
              "${directory}tests" -n auto || failed="${failed} ${name}"
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "Tests failed for:${failed}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
