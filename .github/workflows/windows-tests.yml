name: Windows tests

# Runs the whole suite on a Windows runner, since what breaks only on Windows passes the
# Linux tests unnoticed. Every push to main runs it as a job of the tests, which the
# release waits for. A pull request runs it only when it changes what Windows is known
# to treat differently; the portability code rules cover the rest on Linux, and any
# branch can be run here by hand. A Windows runner costs twice the minutes of a Linux one.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/windows-tests.yml"
      - ".gitattributes"
      - "plugin/hooks/**"
      - "pyproject.toml"
      - "packages/core/src/basstler/bash.py"
      - "packages/core/src/basstler/directory_tree.py"
      - "packages/core/src/basstler/environment.py"
      - "packages/git/src/basstler/git/**"
      - "packages/core/src/basstler/locations.py"
      - "packages/core/src/basstler/plugin_root.py"
      - "packages/notes/src/basstler/setup/**"
      - "packages/core/src/basstler/shell_configuration.py"
      - "packages/basstler/tests/bash_path.py"
      - "test_support/basstler_testing/fixtures.py"
      - "test_support/basstler_testing/executable_stubs.py"
      - "test_support/basstler_testing/suite_shard.py"

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The suite is split into shards run at once, since one Windows runner takes over half
  # an hour for it; each shard runs its share from the job's index and the job total.
  test:
    name: pytest on Windows (shard ${{ matrix.shard }})
    if: "!github.event.pull_request.draft"
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Defender scans every file git and the tests write and every process they start.
      - name: Stop scanning files as they are written
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # The tags give the installed package its release version, which the tests read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Every distribution and the test runner, at the versions uv.lock names, into the
      # interpreter setup-python put on PATH.
      - name: Install the workspace and the test runner
        shell: bash
        run: |
          python -m pip install uv
          UV_PROJECT_ENVIRONMENT="$(python -c 'import sys; print(sys.prefix)')" \
            uv sync --frozen --all-packages

      # The plan page's script is tested in a headless Chromium.
      - name: Install the browser the page tests run in
        run: python -m playwright install chromium

      # The runner's temporary directory is on its faster drive. Each distribution's tests
      # run the shard's share; the plugin declaring the shard options comes from
      # test_support, which is not installed.
      - name: Run each distribution's tests
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PYTHONPATH: test_support
        run: |
          failed=""
          for directory in packages/*/; do
            echo "::group::${directory}"
            status=0
            python -m pytest "${directory}tests" -n auto --durations=20 \
              -p basstler_testing.suite_shard \
              --shard-index "$((${{ strategy.job-index }}))" \
              --shard-count "$((${{ strategy.job-total }}))" || status=$?
            # Status 5: this shard holds none of the distribution's tests.
            if [ "${status}" -ne 0 ] && [ "${status}" -ne 5 ]; then
              failed="${failed} ${directory}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "Tests failed for:${failed}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
