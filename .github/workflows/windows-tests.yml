name: Windows tests

# Runs the whole suite on a Windows runner for every pull request, since what breaks only
# on Windows passes the Linux tests unnoticed. A push to main runs nothing here: the pull
# request already ran it, and a Windows runner costs twice the minutes of a Linux one.
on:
  pull_request:

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The tags give the installed package its release version, which the tests read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basstler and the test runner
        run: |
          python -m pip install --upgrade pip
          pip install --editable . --group dev

      # The plan page's script is tested in a headless Chromium.
      - name: Install the browser the page tests run in
        run: python -m playwright install chromium

      - name: Run the tests
        run: pytest tests -n auto
