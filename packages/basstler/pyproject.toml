[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4", "basstler-build"]
build-backend = "hatchling.build"

[project]
name = "basstler"
description = "Workflow tooling: stacked-pull-request maintenance, the plan site, personal-notes hooks and upstream review reading."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Abdelrhman Bassiouny", email = "bido.bassuny@gmail.com"}]
dynamic = ["version", "dependencies"]

[project.scripts]
basstler = "basstler.__main__:app"

[project.urls]
"Source" = "https://github.com/KAOS-repositories/basstler"
"Bug Tracker" = "https://github.com/KAOS-repositories/basstler/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = {root = "../.."}

# Built with every basstler requirement pinned to this release.
[tool.hatch.metadata.hooks.basstler-sibling-pins]
dependencies = [
    "cyclopts>=5.3",
    "basstler-core",
    "basstler-git",
    "basstler-rules",
    "basstler-github",
    "basstler-reviews",
    "basstler-review-triage",
    "basstler-stack",
    "basstler-plan",
    "basstler-notes",
    "basstler-hub",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basstler"]

# The repository's licence and notices, put at the root of the source distribution so
# the wheel built from it carries them.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

# What this distribution's tests need besides itself.
[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "basstler-core",
    "basstler-git",
    "basstler-github",
    "basstler-hub",
    "basstler-notes",
    "basstler-plan",
    "basstler-reviews",
    "basstler-review-triage",
    "basstler-stack",
]
