[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4", "basstler-build"]
build-backend = "hatchling.build"

[project]
name = "basstler-core"
description = "The foundation every basstler distribution builds on: locations, environment variables, exceptions and the package map."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Abdelrhman Bassiouny", email = "bido.bassuny@gmail.com"}]
dynamic = ["version", "dependencies"]

[project.urls]
"Source" = "https://github.com/KAOS-repositories/basstler"
"Bug Tracker" = "https://github.com/KAOS-repositories/basstler/issues"

# What this distribution adds to the default playbook: `basstler.playbook.contribution`
# loads this group.
[project.entry-points."basstler.contributions"]
basstler-core = "basstler.playbook.core_contribution:CoreContribution"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = {root = "../.."}

# Built with every basstler requirement pinned to this release.
[tool.hatch.metadata.hooks.basstler-sibling-pins]
family = "basstler"
dependencies = [
    "cyclopts>=5.3",
    "jinja2>=3",
    "markdown>=3",
    "nh3>=0.2",
    "pydantic>=2.11",
    "rustworkx>=0.15",
    "tqdm>=4.66",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basstler"]

# The repository's licence and notices, put at the root of the source distribution so
# the wheel built from it carries them.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

# What this distribution's tests need besides itself.
[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
]
