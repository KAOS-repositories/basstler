[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4", "basstler-build"]
build-backend = "hatchling.build"

[project]
name = "basstler-hub"
description = "The plan site: the hub, each repository's index and each plan's page."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Abdelrhman Bassiouny", email = "bido.bassuny@gmail.com"}]
dynamic = ["version", "dependencies"]

[project.urls]
"Source" = "https://github.com/KAOS-repositories/basstler"
"Bug Tracker" = "https://github.com/KAOS-repositories/basstler/issues"

# What a maintenance pass runs once it has closed pull requests whose work landed upstream:
# `basstler.maintenance.landed_closing_follow_up` loads this group, so the pass never imports
# the plan site.
[project.entry-points."basstler.landed_closing_follow_ups"]
plan-site-rebuild = "basstler.plan_site.build_start:PlanSiteRebuild"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = {root = "../.."}

# Built with every basstler requirement pinned to this release.
[tool.hatch.metadata.hooks.basstler-sibling-pins]
family = "basstler"
dependencies = [
    "cyclopts>=5.3",
    "pyyaml>=6",
    "basstler-core",
    "basstler-git",
    "basstler-github",
    "basstler-reviews",
    "basstler-review-triage",
    "basstler-stack",
    "basstler-plan",
    "basstler-notes",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basstler"]

# The repository's licence and notices, put at the root of the source distribution so
# the wheel built from it carries them.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"

# What this distribution's tests need besides itself.
[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "playwright",
    "basstler-core",
    "basstler-git",
    "basstler-github",
    "basstler-notes",
    "basstler-plan",
    "basstler-reviews",
    "basstler-review-triage",
    "basstler-stack",
]
