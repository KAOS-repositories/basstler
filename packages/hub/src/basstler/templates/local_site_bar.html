<form method="post" class="local-site-bar" style="position: sticky; bottom: 0; padding: 0.75rem 1rem; background: Canvas; color: CanvasText; border-top: 1px solid GrayText;">
  <span>Served from this computer only. {% if built_at %}Built {{ built_at }}.{% else %}Not built yet.{% endif %}</span>
  <button type="submit">Refresh</button>
{% if failure %}
  <pre role="alert" style="white-space: pre-wrap;">The last build failed:
{{ failure }}</pre>
{% endif %}
</form>
