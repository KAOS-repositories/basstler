# Installed by `basstler review-triage set-up-mark-viewed`. It marks a pull request's
# mechanical files viewed for the owner of the token stored as {{ token_secret }};
# `basstler review-triage mark-viewed` starts it where it cannot mark them itself. It
# runs basstler's {{ branch_or_tag }}; to pin a release, put its tag wherever that appears below.
name: Mark viewed

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "The number of the pull request whose mechanical files to mark viewed"
        required: true
        type: string
      repository:
        description: "The owner/name repository the pull request is opened on"
        required: true
        type: string
{% if in_reviews_schedule %}
  # On a schedule, every open pull request that asks the token's owner for a review or
  # that it reviewed, each file from where that owner last viewed it.
  schedule:
    - cron: "{{ in_reviews_schedule }}"
{% endif %}

concurrency:
  group: mark-viewed-{{ '${{' }} inputs.pull_request {{ '}}' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mark:
    uses: {{ reusable_workflow }}
    with:
      basstler_branch_or_tag: {{ branch_or_tag }}
      pull_request: {{ '${{' }} inputs.pull_request {{ '}}' }}
{% if in_reviews_schedule and pull_request_repository %}
      repository: {{ '${{' }} inputs.repository || '{{ pull_request_repository.full_name }}' {{ '}}' }}
{% else %}
      repository: {{ '${{' }} inputs.repository {{ '}}' }}
{% endif %}
    secrets:
      viewer_token: {{ '${{' }} secrets.{{ token_secret }} {{ '}}' }}
