[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4", "basstler-build"]
build-backend = "hatchling.build"

[project]
name = "basstler-reviews"
description = "Reading an upstream pull request's checks and review threads."
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Abdelrhman Bassiouny", email = "bido.bassuny@gmail.com"}]
dynamic = ["version", "dependencies"]

[project.urls]
"Source" = "https://github.com/KAOS-repositories/basstler"
"Bug Tracker" = "https://github.com/KAOS-repositories/basstler/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = {root = "../.."}

# Built with every basstler requirement pinned to this release.
[tool.hatch.metadata.hooks.basstler-sibling-pins]
dependencies = [
    "basstler-core",
    "basstler-git",
    "basstler-github",
]

[tool.hatch.build.targets.wheel]
packages = ["src/basstler"]

# What this distribution's tests need besides itself.
[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "basstler-core",
    "basstler-git",
    "basstler-github",
    "basstler-notes",
    "basstler-stack",
]
