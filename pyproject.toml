# The uv workspace of every basstler distribution: each lives in packages/<part> with a
# pyproject.toml of its own, and uv.lock pins what they install together. The root is
# no distribution itself; it holds the development tools and their configuration.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
basstler = { workspace = true }
basstler-build = { workspace = true }
basstler-core = { workspace = true }
basstler-git = { workspace = true }
basstler-rules = { workspace = true }
basstler-github = { workspace = true }
basstler-reviews = { workspace = true }
basstler-stack = { workspace = true }
basstler-notes = { workspace = true }
basstler-plan = { workspace = true }
basstler-hub = { workspace = true }

[dependency-groups]
dev = [
    "playwright",
    "pytest",
    "pytest-xdist",
    "ruff==0.17.3",
]
# Docstrings are formatted by docformatter on top of ruff format - scripts/format_docstrings.py
# runs both, keeping docformatter's change only where ruff leaves it alone.
[tool.docformatter]
make-summary-multi-line = true
pre-summary-newline = true
close-quotes-on-newline = true
black = true


# The mechanical code rules: AGENTS.md states only what a linter cannot check.
[tool.ruff]
target-version = "py312"
src = ["packages/*/src", "packages/*", "test_support"]
# basstler is a namespace package each distribution ships a part of.
namespace-packages = ["packages/*/src/basstler"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "A",        # names that shadow a builtin
    "ANN",      # every parameter and return value is annotated
    "B",        # mutable defaults, getattr with a constant name, and other likely bugs
    "E402",     # imports at the top of the module
    "I002",     # from __future__ import annotations in every module
    "N",        # naming conventions
    "PLC0415",  # no import inside a function
    "PLW0603",  # no global statement
    "PT",       # pytest style, no unittest assertions
    "S101",     # no assert outside tests
    "TID",      # absolute imports and banned APIs
    "UP",       # builtin generics, X | None, unquoted annotations
]
ignore = [
    "ANN401",   # Any is an honest annotation where it is the truth
    "B027",     # a base class may give a hook an empty default body
    "N818",     # exception names are chosen for what failed, not for a suffix
    "PT011",    # a test asserts the exception type, not its message
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["basstler.plan.model.ItemIndentation"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["basstler.class_property.classproperty", "classproperty"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing_extensions".msg = "not a dependency of the package; import from typing"
"unittest.TestCase".msg = "write plain pytest test functions or classes"

[tool.ruff.lint.per-file-ignores]
"{packages/*/tests,test_support}/**" = [
    "ANN",      # test functions and fixtures need no annotations
    "S101",     # tests assert
    "TID252",   # a test imports another test module relatively
    "B018",     # a bare attribute access inside pytest.raises is the call under test
]
# Imports a fixture from a sibling test module, which pytest finds by its parameter name.
"packages/reviews/tests/upstream_reviews/test_open_pull_requests_action.py" = ["F401", "F811"]
# Lower case like the builtin property it stands beside.
"packages/core/src/basstler/class_property.py" = ["N801"]

# Each distribution's tests are run on their own; the helpers several of them share are
# imported from test_support.
[tool.pytest.ini_options]
pythonpath = ["test_support"]
